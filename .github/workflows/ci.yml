name: CI

on: [push, pull_request]

jobs:
  check-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check formatting (fuzzer)
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Not `--all-features`: `bench` requires nightly.
      - name: Run clippy
        run: cargo clippy --all-targets --features serde,simd -- -D warnings
      - name: Run clippy (no SIMD)
        run: cargo clippy --all-targets --no-default-features --features std,rayon -- -D warnings
      - name: Run clippy (fuzzer)
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --all-features -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-msrv
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-msrv
          locked: false

      - name: Verify MSRV
        run: cargo msrv verify --ignore-lockfile

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-tarpaulin
      - run: cargo tarpaulin --out xml
      - name: Upload coverage report to codecov.io
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          # cargo-fuzz requires nightly. Use a known good version
          # (e.g. on Jan 14 2025, a faulty `rustc` nightly panicked).
          toolchain: nightly-2025-11-12
          components: rust-src

      - name: Check benchmarks (`feature(test)` requires nightly)
        run: cargo check --features bench --all-targets

      - name: Install cargo-fuzz
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-fuzz
          locked: false

      - name: Fuzz for a limited time
        run: |
          RUST_BACKTRACE=1 cargo fuzz run fuzz -- -max_total_time=60

  build-and-test-no-std:
    name: CI on ${{ matrix.os }} [no STD]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: cargo build --no-default-features
        run: cargo build --no-default-features

      # unit tests cannot be run in no-std environment

  build-and-test-no-simd:
    name: CI on ${{ matrix.os }} [no SIMD]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: cargo build
        run: cargo build --no-default-features --features std,rayon

      - name: cargo test
        run: cargo test --no-default-features --features std,rayon

  build-and-test-simd:
    name: CI on ${{ matrix.os }} [SIMD]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Had to remove macos-latest, not sure why that is failing.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: cargo build
        run: cargo build --features simd

      - name: cargo test
        run: cargo test --features simd
